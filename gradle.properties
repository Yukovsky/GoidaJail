# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Mod
mod_id=goidajail
mod_name=GoidaJail
mod_license=Apache-2.0
mod_version=1.5.3
mod_group_id=com.goida.goidajail
mod_authors=Goida
mod_description=Server-side jail system for griefers, PvP-abusers and rule-breakers.

# Minecraft / NeoForge
# Compiled against the 21.1.228 floor so the mod is guaranteed to run on 21.1.228 and every
# newer 21.1.x build (228 .. 233+). The runtime range below accepts that whole span.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.228
neo_version_range=[21.1.228,)
loader_version_range=[4,)

# Parchment mappings
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
